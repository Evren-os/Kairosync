db_path = "~/.local/share/atuin/history.db"
key_path = "~/.local/share/atuin/key"
session_path = "~/.local/share/atuin/session"

auto_sync = true
sync_address = "https://api.atuin.sh"
sync_frequency = "5m"

update_check = false

search_mode = "fuzzy"
filter_mode = "global"
workspaces = true
style = "compact"
inline_height = 25
enter_accept = false
exit_mode = "return-original"
show_preview = true
history_format = "{time} {duration} {command}"
invert = false

store_failed = true
secrets_filter = true

history_filter = [
    "--password",
    "--pass=",
    "sshpass -p",
]

[theme]
name = "catppuccin-mocha-mauve"